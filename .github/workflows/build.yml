name: Build plugin

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PLUGIN: BTCPayServer.Plugins.FiatRamp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build plugin (Release)
        run: dotnet build src/$PLUGIN/$PLUGIN.csproj --configuration Release

      - name: Run tests
        run: dotnet test tests/$PLUGIN.Tests/$PLUGIN.Tests.csproj --configuration Release
        env:
          PLAYWRIGHT_HEADLESS: "true"

      - name: Pack .btcpay
        run: |
          dotnet run --project submodules/btcpayserver/BTCPayServer.PluginPacker/BTCPayServer.PluginPacker.csproj -- \
            src/$PLUGIN/bin/Release/net10.0 $PLUGIN artifacts
          find artifacts -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}
          path: artifacts/**

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.btcpay
            artifacts/**/*.btcpay.json
            artifacts/**/SHA256SUMS

  # Installs the release on the live server. Runs only on tags and only once the repository
  # variable DEPLOY_HOST exists (see deploy/DEPLOY.md for the one-time server setup).
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install on the server over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'btcpaydeploy' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY secret is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$PLUGIN.btcpay"
          echo "deploying $URL"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$URL"
